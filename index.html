<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIARACTER Selected</title>
    <style>
        /* 讓全域錨點跳轉具備絲滑的滾動體感 */
        html { scroll-behavior: smooth; }
    </style>
    <style>
        /* 打造極致純白的藝廊背景 */
        body {
            margin: 0;
            padding: 0;
            /* 【強效變更：絕對看得出差別的工藝水泥灰】 */
            background-color: #d4d4d6;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 讓滑動手感在 iPhone/Android 上像絲綢一樣順暢 */
            -webkit-overflow-scrolling: touch; 
        }

        /* 作品容器：確保在各裝置上維持優雅的 3:4 比例呼吸空間 */
        .gallery-container {
            width: 100%;
            max-width: 650px; /* 在大螢幕上限制寬度，維持高級設定集的洗練感 */
            padding: 80px 20px 40px 20px; /* 頂部增加到 80px，預留空間給固定的導覽列 */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 60px; /* 每頁畫冊之間的優雅留白間距 */
        }

        /* 頂部固定極簡導覽列 */
        .gallery-nav {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            z-index: 100;
            background-color: rgba(212, 212, 214, 0.4); /* 半透明工藝灰，避免滑動時文字與後方作品重疊 */
            padding: 6px 20px;
            border-radius: 20px;
            backdrop-filter: blur(2px); /* 現代感毛玻璃 */
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(17, 17, 17, 0.05);
        }
        .gallery-nav a {
            font-family: -apple-system, BlinkMacSystemFont, monospace;
            font-size: 11px;
            color: #1a1a1a;
            text-decoration: none;
            letter-spacing: 0.1em;
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }
        .gallery-nav a:hover, .gallery-nav a:active {
            opacity: 1; /* 手機點擊或游標懸停時變清晰 */
        }

        /* 【全新升級】獨立的頂層數據標記，優雅懸浮於網頁右上角 */
        .top-status-bar {
            position: fixed;    /* 改為固定定位，與導覽列維持絕對的隊形 */
            top: 4px;           /* 完美的對線：位於導覽列（top: 24px）正上方，留出細緻的呼吸空間 */
            left: 50%;
            transform: translateX(-50%); /* 完美的水平絕對置中 */
            z-index: 101;       /* 確保高於導覽列（100），絕對不被遮擋 */
            pointer-events: none; /* 讓鼠標事件穿透，完全不影響網頁滾動或點擊 */
        }
        .top-status-bar img {
            display: inline-block; /* 配合 text-align 完美置中 */
            height: 21px; 
            opacity: 0.3; /* 回歸淡淡的工藝灰印刷感 */
            filter: grayscale(1) contrast(1.2) brightness(1.05);
             user-select: none;
             -webkit-user-drag: none;
            pointer-events: none;
        }
        
        /* 新增：動態生成的章節代碼樣式 */
        .dynamic-chapter-code {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            font-size: 11px;
            font-weight: 500;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 8px; /* 代碼與下方圖片黑框的微小呼吸空間 */
            padding-left: 2px;
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
        }

        /* 畫冊圖片的基礎設定 */
        .artwork {
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3; /* 強制網頁預留 4:3 空間，防止載入時畫面跳動 */
            object-fit: contain;
            display: block;
            /* 【新增：細緻的黑色外框與呼吸空間】 */
            border: 2px solid #111111; /* 2px 寬度的極簡深黑外框 */
            box-sizing: border-box;    /* 確保外框寬度不會擠壓到 3:4 比例 */
            /* 溫和的載入漸顯效果 */
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
        }

        /* 讓作品優雅浮現的動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 針對手機螢幕的微調，讓留白更精準 */
        @media (max-width: 480px) {
            .gallery-container {
                padding: 70px 15px 20px 15px; /* 手機版同步預留頂部導覽列空間 */
                gap: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="top-status-bar">
        <img id="dynamic-counter" alt="Hits">
    </div>

    <!-- 頂部極簡章節跳轉 -->
    <div class="gallery-nav">
        <!-- 計數器圖片改由下方的 JavaScript 動態隨環境生成 -->
        <a href="#cover">COVER</a>
        <a href="#ch1">CH 1</a>
        <a href="#ch2">CH 2</a>
        <a href="#ch3">CH 3</a>
        <a href="#ch4">CH 4</a>
        <a href="#origin">ORIGIN</a>
    </div>
    
    <div class="gallery-container">
        <img class="artwork" src="Cover/01.webp" alt="Cover">
        <img class="artwork" src="Cover/02.webp" alt="Chapter 1">
        <img class="artwork" src="Season1/01.webp" alt="101">
        <img class="artwork" src="Season1/02.webp" alt="102">
        <img class="artwork" src="Season1/03.webp" alt="103">
        <img class="artwork" src="Season1/04.webp" alt="104">
        <img class="artwork" src="Season1/05.webp" alt="105">
        <img class="artwork" src="Season1/06.webp" alt="106">
        <img class="artwork" src="Season1/07.webp" alt="107">
        <img class="artwork" src="Cover/03.webp" alt="Chapter 2">
        <img class="artwork" src="Cover/50.webp" alt="201">
        <img class="artwork" src="Cover/50.webp" alt="202">
        <img class="artwork" src="Season2/03.webp" alt="203">
        <img class="artwork" src="Season2/04.webp" alt="204">
        <img class="artwork" src="Cover/50.webp" alt="205">
        <img class="artwork" src="Cover/50.webp" alt="206">
        <img class="artwork" src="Cover/50.webp" alt="207">
        <img class="artwork" src="Cover/04.webp" alt="Chapter 3">
        <img class="artwork" src="Cover/50.webp" alt="301">
        <img class="artwork" src="Cover/50.webp" alt="302">
        <img class="artwork" src="Cover/50.webp" alt="303">
        <img class="artwork" src="Cover/50.webp" alt="304">
        <img class="artwork" src="Cover/50.webp" alt="305">
        <img class="artwork" src="Cover/50.webp" alt="306">
        <img class="artwork" src="Cover/50.webp" alt="307">
        <img class="artwork" src="Cover/05.webp" alt="Chapter 4">
        <img class="artwork" src="Cover/50.webp" alt="401">
        <img class="artwork" src="Cover/50.webp" alt="402">
        <img class="artwork" src="Cover/00.webp" alt="ORIGIN">
        <img class="artwork" src="Season0/01.webp" alt="001">
        <img class="artwork" src="Season0/02.webp" alt="002">
        <img class="artwork" src="Cover/99.webp" alt="THANK YOU">
        <img class="artwork" src="Cover/50.webp" alt="NEXT">
    </div>

    <!-- 新增：自動抓取 alt 並生成代碼的輕量腳本 -->
    <script>
        document.querySelectorAll('.artwork').forEach((img, index) => {
            // 1. 建立一個外殼結構容器
            const wrapper = document.createElement('div');
            wrapper.style.width = '100%';

            // 根據你最新設定的 alt 文字，自動幫外殼補上對應的導覽 ID
            const altText = img.alt.toUpperCase();
            if (altText === 'COVER') wrapper.id = 'cover';
            if (altText === 'CHAPTER 1') wrapper.id = 'ch1';
            if (altText === 'CHAPTER 2') wrapper.id = 'ch2';
            if (altText === 'CHAPTER 3') wrapper.id = 'ch3';
            if (altText === 'CHAPTER 4') wrapper.id = 'ch4';
            if (altText === 'ORIGIN') wrapper.id = 'origin';
            
            // 2. 建立章節代碼標籤，直接沿用 alt 的文字
            const codeDiv = document.createElement('div');
            codeDiv.className = 'dynamic-chapter-code';

            const pageNumber = String(index + 1).padStart(2, '0');
            codeDiv.textContent = `${pageNumber} / ${img.alt}`;

            // 3. 在 DOM 中用 wrapper 把代碼和圖片包起來
            img.parentNode.insertBefore(wrapper, img);
            wrapper.appendChild(codeDiv);
            wrapper.appendChild(img);
        });
    </script>

    <!-- 智能環境計數判定 -->
    <script>
        (function() {
            // 1. 請將這裡改成你真正的 GitHub Pages 網址
            const realProductionUrl = 'https://yenchia-x.github.io/chiaracter';

            // 2. 檢查目前瀏覽器的網址狀態
            const currentUrl = window.location.href;
            const isLocal = currentUrl.includes('localhost') || currentUrl.includes('127.0.0.1') || currentUrl.startsWith('file:');
            const isDevMode = currentUrl.includes('dev=true'); // 檢查網址有沒有帶 ?dev=true

            let targetTrackUrl = realProductionUrl;

            // 3. 如果是本地開發，或是線上網址帶有開發者參數，就切換到「測試用沙盒計數網址」
            if (isLocal || isDevMode) {
                targetTrackUrl = realProductionUrl + '-sandbox-testing-route';
                // 這會讓計數器去累積到另一個不存在的網址，不會污染你真正的首頁數字
            }

            // 4. 換成更穩定的極簡流計數器 (指定純黑字體 #1a1a1a，無背景)
            const baseUrl = 'https://api.visitorbadge.io/api/visitors';
            const params = `?path=${encodeURIComponent(targetTrackUrl)}&label=HITS&labelColor=%231a1a1a&countColor=%231a1a1a&style=none`;

            document.getElementById('dynamic-counter').src = baseUrl + params;
        })();
    </script>
</body>
</html>
